name: Build Windows, Linux and macOS apps

# The original workflow lived in instrument-panels/.github/workflows/ , which
# GitHub never reads -- only .github/workflows/ at the repository root runs.
#
# Run it from the Actions tab (artifacts only), or push a tag to also publish
# a release:  git tag v1.1 && git push --tags

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            ext: ".exe"
          - os: ubuntu-22.04          # glibc 2.35 -> Debian 12+, Ubuntu 22.04+
            label: linux-x86_64
            ext: ""
          - os: macos-15-intel        # Intel Macs
            label: macos-x86_64
            ext: ""
          - os: macos-15              # Apple Silicon
            label: macos-arm64
            ext: ""

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r instrument-panels/tinysa_panel/requirements.txt pyinstaller
          pip install -r instrument-panels/nanovna_panel/requirements.txt

      - name: Report dependency versions
        run: |
          python -V
          python -c "import PyQt6.QtCore as q, numpy, pyqtgraph, serial; print('Qt', q.QT_VERSION_STR, '| numpy', numpy.__version__, '| pyqtgraph', pyqtgraph.__version__)"
          python -m PyInstaller --version

      - name: Build tinySA panel
        working-directory: instrument-panels/tinysa_panel
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --exclude-module pkg_resources --name tinySA_Panel tinysa_panel.py

      - name: Build NanoVNA panel
        working-directory: instrument-panels/nanovna_panel
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --exclude-module pkg_resources --name NanoVNA_Panel vna_panel.py

      - name: Ad-hoc code sign (macOS)
        if: runner.os == 'macOS'
        working-directory: instrument-panels
        run: |
          for app in tinysa_panel/dist/tinySA_Panel.app nanovna_panel/dist/NanoVNA_Panel.app; do
            [ -d "$app" ] && codesign --force --deep --sign - "$app" && codesign -dv "$app" 2>&1 | head -3
          done
          true

      - name: Smoke test - both apps must stay up 15s with no hardware
        working-directory: instrument-panels
        run: |
          set +e
          fail=0
          smoke () {
            local name="$1" dir="$2" bin
            if [ -d "$dir/dist/$name.app" ]; then bin="$dir/dist/$name.app/Contents/MacOS/$name";
            elif [ -f "$dir/dist/$name.exe" ]; then bin="$dir/dist/$name.exe";
            else bin="$dir/dist/$name"; fi
            echo "::group::smoke $name ($bin)"
            file "$bin" || true
            QT_QPA_PLATFORM=offscreen "$bin" --sim > "/tmp/$name.log" 2>&1 &
            local pid=$!
            sleep 15
            if kill -0 $pid 2>/dev/null; then
              echo "PASS: $name alive after 15s (pid $pid)"
              kill $pid 2>/dev/null; sleep 1; kill -9 $pid 2>/dev/null
            else
              wait $pid; echo "FAIL: $name exited early (rc=$?)"; cat "/tmp/$name.log"; fail=1
            fi
            echo "::endgroup::"
          }
          smoke tinySA_Panel tinysa_panel
          smoke NanoVNA_Panel nanovna_panel
          exit $fail

      - name: Package
        working-directory: instrument-panels
        run: |
          set -e
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent tinysa_panel/dist/tinySA_Panel.app out/tinySA_Panel-${{ matrix.label }}.zip
            ditto -c -k --sequesterRsrc --keepParent nanovna_panel/dist/NanoVNA_Panel.app out/NanoVNA_Panel-${{ matrix.label }}.zip
          else
            cp "tinysa_panel/dist/tinySA_Panel${{ matrix.ext }}" "out/tinySA_Panel-${{ matrix.label }}${{ matrix.ext }}"
            cp "nanovna_panel/dist/NanoVNA_Panel${{ matrix.ext }}" "out/NanoVNA_Panel-${{ matrix.label }}${{ matrix.ext }}"
          fi
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: instrument-panels/out/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: instrument-panels/out/*
