name: Build Windows, Linux and macOS apps

# The original workflow lived in instrument-panels/.github/workflows/ , which
# GitHub never reads -- only .github/workflows/ at the repository root runs.
#
# Run it from the Actions tab (artifacts only), or push a tag to also publish
# a release:  git tag v1.1 && git push --tags
#
# macOS signing (optional, needs an Apple Developer Program membership).
# Set these repository secrets to ship a Gatekeeper-clean .app; with none of
# them set the build falls back to an ad-hoc signature, and downloaders get
# "Apple could not verify".
#   MACOS_CERT_P12       base64 of the "Developer ID Application" certificate
#                        (macOS: base64 -i cert.p12 -o cert.b64, paste cert.b64)
#   MACOS_CERT_PASSWORD  password chosen when exporting that .p12
#   APPLE_ID             Apple ID email of the developer account
#   APPLE_TEAM_ID        10-char Team ID (developer.apple.com > Membership)
#   APPLE_APP_PASSWORD   app-specific password from appleid.apple.com
# The signing identity string is auto-detected from the keychain, so it does
# not need to be a secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      # secrets are not available in a step-level `if:`, so evaluate once here
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            ext: ".exe"
          - os: ubuntu-22.04          # glibc 2.35 -> Debian 12+, Ubuntu 22.04+
            label: linux-x86_64
            ext: ""
          - os: macos-15-intel        # Intel Macs (also runs on Apple Silicon via Rosetta 2)
            label: macos-x86_64
            ext: ""
          # NOTE: a native arm64 build needs an Apple Silicon runner. macos-15 /
          # macos-26 / macos-latest (the arm64 labels) never get allocated for this
          # repo -- the job sits queued ~15 min and is cancelled, so it is left out.
          # Build arm64 locally on an Apple Silicon Mac instead, see the release notes.

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r instrument-panels/tinysa_panel/requirements.txt pyinstaller
          pip install -r instrument-panels/nanovna_panel/requirements.txt

      - name: Report dependency versions
        run: |
          python -V
          python -c "import PyQt6.QtCore as q, numpy, pyqtgraph, serial; print('Qt', q.QT_VERSION_STR, '| numpy', numpy.__version__, '| pyqtgraph', pyqtgraph.__version__)"
          python -m PyInstaller --version

      - name: Build tinySA panel
        working-directory: instrument-panels/tinysa_panel
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --exclude-module pkg_resources --name tinySA_Panel tinysa_panel.py

      - name: Build NanoVNA panel
        working-directory: instrument-panels/nanovna_panel
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --exclude-module pkg_resources --name NanoVNA_Panel vna_panel.py

      # ---------------------------------------------------------------- signing
      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # decode via python: same flag on every runner, unlike base64(1)
          python -c "import base64,os; open('/tmp/cert.p12','wb').write(base64.b64decode(os.environ['MACOS_CERT_P12'].strip()))"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          rm -f /tmp/cert.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::imported keychain has no 'Developer ID Application' identity"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "MACOS_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign with Developer ID + hardened runtime (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        working-directory: instrument-panels
        run: |
          set -euo pipefail
          for app in tinysa_panel/dist/tinySA_Panel.app nanovna_panel/dist/NanoVNA_Panel.app; do
            [ -d "$app" ] || continue
            echo "::group::sign $app"
            # --deep reaches the PyInstaller bootloader, Qt frameworks and plugins.
            # Apple calls it deprecated, but it is what notarization accepts for
            # PyInstaller bundles; verify + the notary log below are the real check.
            codesign --force --deep --timestamp --options runtime \
              --entitlements mac-entitlements.plist \
              --sign "$MACOS_IDENTITY" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | sed -n '1,6p'
            echo "::endgroup::"
          done

      - name: Ad-hoc code sign (macOS, fallback when no certificate)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT != 'true'
        working-directory: instrument-panels
        run: |
          echo "::warning::No MACOS_CERT_P12 secret -- ad-hoc signing only; downloaders will hit 'Apple could not verify'."
          for app in tinysa_panel/dist/tinySA_Panel.app nanovna_panel/dist/NanoVNA_Panel.app; do
            [ -d "$app" ] && codesign --force --deep --sign - "$app" && codesign -dv "$app" 2>&1 | head -3
          done
          true

      - name: Smoke test - both apps must stay up 15s with no hardware
        working-directory: instrument-panels
        run: |
          set +e
          fail=0
          smoke () {
            local name="$1" dir="$2" bin
            if [ -d "$dir/dist/$name.app" ]; then bin="$dir/dist/$name.app/Contents/MacOS/$name";
            elif [ -f "$dir/dist/$name.exe" ]; then bin="$dir/dist/$name.exe";
            else bin="$dir/dist/$name"; fi
            echo "::group::smoke $name ($bin)"
            file "$bin" || true
            QT_QPA_PLATFORM=offscreen "$bin" --sim > "/tmp/$name.log" 2>&1 &
            local pid=$!
            sleep 15
            if kill -0 $pid 2>/dev/null; then
              echo "PASS: $name alive after 15s (pid $pid)"
              kill $pid 2>/dev/null; sleep 1; kill -9 $pid 2>/dev/null
            else
              wait $pid; echo "FAIL: $name exited early (rc=$?)"; cat "/tmp/$name.log"; fail=1
            fi
            echo "::endgroup::"
          }
          smoke tinySA_Panel tinysa_panel
          smoke NanoVNA_Panel nanovna_panel
          exit $fail

      # ------------------------------------------------------------ notarizing
      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        working-directory: instrument-panels
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for app in tinysa_panel/dist/tinySA_Panel.app nanovna_panel/dist/NanoVNA_Panel.app; do
            [ -d "$app" ] || continue
            name=$(basename "$app" .app)
            echo "::group::notarize $app"
            # notarytool submits an archive, not a bundle
            ditto -c -k --sequesterRsrc --keepParent "$app" "/tmp/$name-notarize.zip"
            xcrun notarytool submit "/tmp/$name-notarize.zip" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait --timeout 30m
            # stapling stores the ticket inside the bundle, so Gatekeeper can
            # approve it offline on a machine that never saw the upload
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            spctl -a -vvv -t exec "$app" 2>&1 | sed 's/^/spctl: /' || true
            echo "::endgroup::"
          done

      - name: Package
        working-directory: instrument-panels
        run: |
          set -e
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent tinysa_panel/dist/tinySA_Panel.app out/tinySA_Panel-${{ matrix.label }}.zip
            ditto -c -k --sequesterRsrc --keepParent nanovna_panel/dist/NanoVNA_Panel.app out/NanoVNA_Panel-${{ matrix.label }}.zip
          else
            cp "tinysa_panel/dist/tinySA_Panel${{ matrix.ext }}" "out/tinySA_Panel-${{ matrix.label }}${{ matrix.ext }}"
            cp "nanovna_panel/dist/NanoVNA_Panel${{ matrix.ext }}" "out/NanoVNA_Panel-${{ matrix.label }}${{ matrix.ext }}"
          fi
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: instrument-panels/out/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: instrument-panels/out/*
